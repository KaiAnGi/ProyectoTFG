<div class="waiting-room-container">
  <!-- Logo de fondo -->
  <div class="background-logo"></div>

  <!-- Botón BACK (esquina inferior izquierda) -->
  <button class="back-button" (click)="goBack()">BACK</button>

  <!-- Contenido principal -->
  <div class="content">
    <!-- Título -->
    <h1 class="title">WAITING ROOM</h1>

    <!-- Room Info -->
    <div class="room-info">
      <div class="info-item room-code-item">
        <span class="label">ROOM CODE:</span>
        <span class="value">{{ roomCode }}</span>
        <button class="copy-button" (click)="copyRoomCode()" aria-label="Copiar código de sala">
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <path
              d="M16 1H4a2 2 0 0 0-2 2v14h2V3h12V1Zm3 4H8a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h11a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2Zm0 16H8V7h11v14Z"
              fill="currentColor" />
          </svg>
        </button>
        <span class="copy-feedback" *ngIf="copyFeedback">Copiado</span>
      </div>
      <div class="info-item">
        <span class="label">ROOM NAME:</span>
        <span class="value">{{ roomName }}</span>
      </div>
    </div>

    <!-- Players in Room -->
    <h2 class="subtitle">PLAYERS IN ROOM</h2>

    <!-- Player Cards -->
    <div class="players-container">
      <!-- Player 1 (You) -->
      <div class="player-card">
        <div class="player-header">
          <span class="player-title">PLAYER 1 (YOU)</span>
        </div>
        <div class="player-avatar">
          <svg viewBox="0 0 24 24" fill="currentColor">
            <circle cx="12" cy="8" r="4" />
            <path d="M12 14c-6 0-8 3-8 5v2h16v-2c0-2-2-5-8-5z" />
          </svg>
        </div>
        <!-- Botón Ready interactivo -->
        <button class="ready-button" [class.is-ready]="player1.isReady" [class.not-ready]="!player1.isReady"
          (click)="toggleReady()">
          {{ player1.isReady ? 'READY' : 'NOT READY' }}
        </button>
      </div>

      <!-- Player 2 (Opponent) -->
      <div class="player-card">
        <div class="player-header">
          <span class="player-title">PLAYER 2 (OPPONENT)</span>
        </div>
        <div class="player-avatar" [class.waiting]="!player2.isReady">
          <svg viewBox="0 0 24 24" fill="currentColor">
            <circle cx="12" cy="8" r="4" />
            <path d="M12 14c-6 0-8 3-8 5v2h16v-2c0-2-2-5-8-5z" />
          </svg>
        </div>
        <!-- Estado del oponente (no interactivo) -->
        <div class="player-status" [class.ready]="player2.isReady" [class.waiting]="!player2.isReady">
          {{ player2.isReady ? 'READY' : 'WAITING...' }}
        </div>
      </div>
    </div>

    <!-- Action Buttons -->
    <div class="action-buttons">
      <button class="action-btn start-btn" [disabled]="!canStartGame()" (click)="startGame()">
        START GAME
      </button>
      <button class="action-btn leave-btn" (click)="leaveRoom()">
        LEAVE ROOM
      </button>
    </div>
  </div>

  <!-- Loading spinner (esquina inferior derecha) -->
  <div class="loading-spinner" *ngIf="!player2.isReady">
    <div class="spinner"></div>
  </div>
</div>
