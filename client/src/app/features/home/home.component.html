<div class="splash-screen">
    <h1 class="game-title">ROCK, PAPER OR SCISSORS</h1>

    <div class="hands-container">
        <!-- Mano izquierda - ROCK (Piedra) -->
        <div class="hand-item">
            <img src="/images/rockHand.png" alt="Rock" class="hand-icon">
        </div>

        <!-- Mano centro - PAPER (Papel) -->
        <div class="hand-item">
            <img src="/images/PaperHand.png" alt="Paper" class="hand-icon">
        </div>

        <!-- Mano derecha - SCISSORS (Tijeras) -->
        <div class="hand-item">
            <img src="/images/scissorsHand.png" alt="Scissors" class="hand-icon">
        </div>
    </div>

    <p class="game-subtitle">THE GAME</p>

    <button class="start-button" (click)="onStart()">
        START
    </button>
</div>
