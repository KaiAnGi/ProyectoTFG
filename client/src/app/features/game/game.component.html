<div class="game-container">
  <!-- Status Panel -->
  <app-status-panel [gameState]="gameState$ | async"></app-status-panel>

  <!-- Game Arena Central -->
  <app-game-arena [gameState]="gameState$ | async"></app-game-arena>

  <!-- Controles Derecha -->
  <div class="controls-panel">
    <app-action-buttons
      [isRoundActive]="(gameState$ | async)?.isRoundActive"
      (choiceMade)="onPlayerChoice($event)">
    </app-action-buttons>

    <!-- Gesture Detector -->
    <app-gesture-detector
      [isCameraReady]="isCameraReady$ | async"
      (gestureDetected)="onGestureDetected($event)">
    </app-gesture-detector>

    <!-- History -->
    <app-history [history]="(gameState$ | async)?.history"></app-history>
  </div>

  <!-- Botón salir -->
  <button (click)="leaveGame()" class="leave-btn">Salir</button>
</div>
