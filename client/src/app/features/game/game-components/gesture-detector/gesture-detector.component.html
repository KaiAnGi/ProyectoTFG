<!-- gesture-detector.component.html -->
<div class="gesture-detector">
  <h3>Detector de Gestos</h3>

  <div class="video-container">
    <video #videoElement class="video-hidden"></video>
    <canvas #canvasElement width="320" height="240" class="gesture-canvas"></canvas>
  </div>

  <div class="gesture-status">
    @if (isCameraReady) {
      <div class="status-ready">
        <span class="indicator"></span>
        Cámara activa
      </div>
    } @else {
      <div class="status-loading">Iniciando cámara...</div>
    }

    @if (currentGesture) {
      <div class="detected-gesture">
        <div class="gesture-icon {{ getGestureIconClass(currentGesture) }}"></div>
        <div class="gesture-info">
          <h4>{{ getGestureDisplay(currentGesture) }}</h4>
          <div class="confidence-row">
            <span class="confidence-bar">
              <span [style.width.%]="confidence * 100"></span>
            </span>
            <span class="confidence">{{ (confidence * 100) | number:'1.0-0' }}%</span>
          </div>
        </div>
      </div>
    } @else {
      <div class="no-gesture">
        <div class="hand-open-icon"></div>
        ¡Muestra tu mano!
      </div>
    }

    @if (error) {
      <div class="error">{{ error }}</div>
    }
  </div>
</div>
